name: juya-admin-api-test

# GitHub test 分支, 云效构建环境必须支持 Docker
# ECS_TEST_MACHINE_GROUP_ID: 只含 8.163.84.24 的测试主机组
# 制品仓库服务连接在 Flow 控制台绑定,不需要 ACR
stages:
  build_stage:
    name: 测试并构建镜像制品
    jobs:
      build_job:
        name: 隔离测试与 Docker 镜像打包
        runsOn: public/cn-hangzhou
        steps:
          build_step:
            name: test 分支验证与打包
            step: Command
            with:
              run: |
                set -eu
                test "${CI_COMMIT_REF_NAME}" = test
                sh deploy/ci-verify.sh
                sh deploy/build-artifact.sh "${CI_COMMIT_REF_NAME}" "${CI_COMMIT_SHA}" artifact
          upload_step:
            name: 上传后端制品
            step: ArtifactUpload
            with:
              uploadType: flowPublic
              artifact: juya_admin_api_test
              filePath:
                - artifact/

  deploy_stage:
    name: 发布测试 ECS
    jobs:
      deploy_job:
        name: 备份迁移并更新管理后端
        component: VMDeploy
        with:
          artifact: $[stages.build_stage.build_job.upload_step.artifacts.juya_admin_api_test]
          machineGroup: ${ECS_TEST_MACHINE_GROUP_ID}
          artifactDownloadPath: /home/admin/app/juya-admin-api-test.tgz
          executeUser: root
          run: |
            set -eu
            test "${CI_COMMIT_REF_NAME}" = test
            staging="$(mktemp -d /tmp/juya-admin-api-test.XXXXXX)"
            trap 'rm -rf "$staging"' EXIT
            tar xzf /home/admin/app/juya-admin-api-test.tgz -C "$staging"
            sh "$staging/artifact/deploy/ecs-artifact-deploy.sh" "${CI_COMMIT_REF_NAME}" "$staging/artifact"
