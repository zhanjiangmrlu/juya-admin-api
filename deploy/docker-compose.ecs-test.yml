# 与 ecs-2gb.yml 合并使用, 保留项目名、网络、数据库和 Redis 数据卷
x-test: &test
  JUYA_ENVIRONMENT: test
  JUYA_ALLOW_INSECURE_HTTP: "false"

services:
  migrate:
    environment: *test
  admin-api:
    environment: *test
  admin-worker:
    environment: *test
  admin-beat:
    # 实测 160 MiB 会在加载任务模块时 OOM；仅调整测试环境。
    mem_limit: ${JUYA_ADMIN_BEAT_MEMORY_LIMIT:-256m}
    environment: *test
